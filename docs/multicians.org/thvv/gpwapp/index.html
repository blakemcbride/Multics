<!DOCTYPE html>
<html manifest="gpwapp.manifest" lang="en"> <!-- must be served as text/cache-manifest, see .htaccess -->
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="user-scalable=no, width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="apple-touch-icon" href="gpw-iphon-icon.png"/> <!-- 57px x 57px -->
    <link rel="apple-touch-startup-image" href="gpw-iphon-home.png" /> <!-- 320px x 460px -->
    <meta name="description" content="Pronounceable password generator in Javascript.">
    <title>GPW</title>
    <style type="text/css"  media="screen, mobile" title="main" charset="utf-8">
      body {font-family: monospace; overflow: hidden; margin: 0 0 0 10px; padding: 0;}
      #outer {width: 320px; height: 460px;}
      #text {font-size: 140%; font-weight: bold;}
      h1 {font-size: 120%;}
      .fm {margin-left: 40px;}
      .inst {font-size: 80%; width: 320px;}
    </style>
    <!-- Javascript code to generate random pronounceable passwords. -->
    <!-- .. library function that generates a password. -->
    <script src="gpw.js"></script>
    <!-- .. Function that generates a list of 10 passwords and inserts them into the page. -->
    <script>
      function generate(idname) {
	var x = "";
	var s;
	for (i=0; i<=10; i++) {
	  s = "";
	  while (s.length < 11) {
	    s = GPW.pronounceable(12);
	  }
	  x += s + "<br>";
	}
	var v = document.getElementById(idname);
	v.innerHTML = x;
	return false;
      } // generate
    </script>
  </head>
  <body onload="generate('text')">
    <div class="outer">
      <h1>Password Generator</h1>
      <p class="inst">
	Passwords are generated locally on your device.
	Add capitalization, digits, &amp; punctuation.
      </p>
      <form method="POST" class="fm" action="#" onsubmit="return generate('text')">
	<p id="text">...</p>
	<input name="gen" type="submit" value="Generate Passwords"> 
      </form>
      <p class="inst">
	iPhone: select "save to home screen" for local use<br>
	Info: <a href="../gpw-js.html" target="_blank">https://www.multicians.org/thvv/gpw-js.html</a>
      </p>
    </div>
  </body>
</html>
